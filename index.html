<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microwave Simulator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">INTERACTIVE APPLIANCE</p><h1>Microwave simulator</h1><p>Set a time, close the door, and start cooking.</p></header>
    <section class="microwave" aria-label="Microwave controls">
      <div class="door" id="door">
        <span id="doorLabel">DOOR CLOSED</span>
        <div class="window"><div class="plate"></div><div class="bowl"></div></div>
        <span class="handle" aria-hidden="true"></span>
      </div>
      <div class="controls">
        <p class="display-label">TIME REMAINING</p>
        <output id="timer" aria-label="Seconds remaining">0 s</output>
        <p id="status" role="status" aria-live="polite">Ready. Set a cooking time.</p>
        <form id="timeForm">
          <label for="seconds">Cooking time (seconds)</label>
          <div class="time-input"><input id="seconds" type="number" min="1" max="3600" step="1" value="30" required><button type="submit" id="setTime">Set time</button></div>
        </form>
        <button id="start" class="primary" type="button">Start heating</button>
        <div class="button-row"><button id="pause" type="button" disabled>Pause</button><button id="cancel" type="button">Cancel / Reset</button></div>
      </div>
    </section>
    <button id="toggleDoor" class="door-button" type="button" aria-controls="door" aria-expanded="false">Open door</button>
    <p class="hint">Opening the door pauses heating. Close it and press Resume to continue.</p>
  </main>
</body>
</html>
